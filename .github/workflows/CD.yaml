name: CD

on:
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/fintlabs/fint-utdanning-kodeverk-adapter

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      sha: ${{ steps.version.outputs.sha }}
      orgs: ${{ steps.orgs.outputs.orgs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Map branch to environment
        id: env
        run: |
          case "$GITHUB_REF_NAME" in
            main)    echo "environment=api"  >> "$GITHUB_OUTPUT" ;;
            develop) echo "environment=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "no environment for branch $GITHUB_REF_NAME"; exit 1 ;;
          esac

      # The image is tagged with the last commit that changed its inputs, so a
      # kustomize-only change reuses the image that is already in the registry.
      - name: Resolve image version
        id: version
        run: |
          sha=$(git log -1 --abbrev=7 --format=%h -- src build.gradle settings.gradle gradle.properties gradle gradlew Dockerfile)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image version: $sha"

      - name: Discover org overlays
        id: orgs
        run: |
          dir="kustomize/overlays/${{ steps.env.outputs.environment }}"
          orgs=$(find "$dir" -mindepth 1 -maxdepth 1 -type d ! -name "*.disabled" -exec basename {} \; 2>/dev/null | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"
          echo "targets in $dir: $orgs"

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/fintlabs/fint-utdanning-kodeverk-adapter:sha-${{ needs.setup.outputs.sha }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether ${{ env.IMAGE }} already exists
        id: exists
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already in registry, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.exists.outputs.exists == 'false'

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.setup.outputs.sha }}

  deploy:
    needs: [setup, build]
    if: needs.setup.outputs.orgs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJson(needs.setup.outputs.orgs) }}
    environment: ${{ needs.setup.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve cluster + resource group
        id: aks
        run: |
          case "$ENVIRONMENT" in
            beta) echo "cluster=aks-beta-fint-2021-11-23" >> "$GITHUB_OUTPUT" ;;
            api)  echo "cluster=aks-api-fint-2022-02-08"  >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown environment $ENVIRONMENT"; exit 1 ;;
          esac
          echo "resource-group=rg-aks-$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Bake manifests with Kustomize
        id: bake
        uses: azure/k8s-bake@v4.1.1
        with:
          renderEngine: "kustomize"
          kustomizationPath: "kustomize/overlays/${{ env.ENVIRONMENT }}/${{ matrix.org }}"

      - name: Substitute image into baked YAML
        id: substitute
        uses: azure/k8s-artifact-substitute@v2.0.0
        with:
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          # Replace the image tag in the Flais Application because k8s-deploy skips custom resources.
          images: ${{ env.IMAGE_NAME }}:sha-${{ needs.setup.outputs.sha }}

      - name: Prepare manifests for deployment
        id: deploy-manifests
        shell: bash
        env:
          SOURCE_DIRECTORY: ${{ steps.substitute.outputs.directory }}
        run: |
          set -euo pipefail

          destination="$GITHUB_WORKSPACE/.k8s-deploy-manifests"
          mkdir -p "$destination"
          cp -aL -- "$SOURCE_DIRECTORY/." "$destination/"

          echo "manifests=$destination" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v3.1.0
        with:
          creds: "${{ secrets[format('AKS_{0}_FINT_GITHUB', needs.setup.outputs.environment)] }}"

      - name: Set the target cluster
        uses: azure/aks-set-context@v5.0.1
        with:
          cluster-name: "${{ steps.aks.outputs.cluster }}"
          resource-group: "${{ steps.aks.outputs.resource-group }}"
          admin: "true"

      - name: Ensure namespace ${{ matrix.org }}
        run: kubectl create namespace ${{ matrix.org }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        uses: azure/k8s-deploy@v7.0.1
        with:
          action: deploy
          manifests: ${{ steps.deploy-manifests.outputs.manifests }}
          pull-images: false
          namespace: ${{ matrix.org }}
