name: CI

on:
  pull_request:
    paths-ignore:
      - 'kustomize/**'
  push:
    branches: [main, develop]
    paths-ignore:
      - 'kustomize/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
